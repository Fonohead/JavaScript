<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Кредитный калькулятор</title>
</head>
    
<body>
    <ul>
    <li>если клиенту нет 18 лет, то кредит он не получит</li>
    <li>если клиенту от 18 до 21, то он может получить максимум 50000</li>
    <li>если клиенту от 22 до 35, то он сможет получить максимум 400000</li>
    <li>если клиенту от 36 до 65, то ему одобрят максимум 1000000</li>
    <li>кредит могут выдавать суммами кратными 10000.</li>
    </ul>
    
    <script>
        let age = Number(prompt('Введите ваш возраст'));
        if (!age || isNaN(age)) {
            alert('Возраст должен быть положительным числом.');
        } else if (age < 18 || age > 65) {
            alert('К сожалению мы не можем выдать вам кредит.');
        } else {
            let maxLimit = 0;
            if (age >= 18 && age <= 21) {
                maxLimit = 50000;
            } else if (age >= 22 && age <= 35) {
                maxLimit = 400000;
            } else if (age >= 36 && age <= 65) {
                maxLimit = 1000000;
            }
            let amount = Number(prompt(`Мы можем выдать вам максимум ${maxLimit}. \nВведите сумму кратную 1000.`));
            if (!amount) {
                alert('Видимо вам кредит не нужен. Всего доброго!');
            } else if (isNaN(amount) || amount < 0) {
                alert ('Сумма должна быть положительным числом.')    
            } else if (amount > maxLimit) {
                alert(`Вы превысили свой лимит. Ваш максимум ${maxLimit}.`);
            } else if (amount % 1000 > 0) {
                let approvedAmount = Math.floor(amount / 1000) * 1000;
                alert(`Вы ввели значение не кратное 1000. Мы можем выдать ${approvedAmount}.`);    
            }

        }
        
    </script>
</body>
    
</html>
