<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Практика JS</title>
</head>
<body>
    <script>
        let word = prompt('Введите слово');
        let wordLowercase = word.toLowerCase();
        let wordReverse = wordLowercase.split('').reverse().join('');

        if (wordLowercase === wordReverse) {
            alert(`Слово ${word} является палиндромом`);
        } else {
            alert(`Слово ${word} не является палиндромом`); 
        }
    </script>
</body>
</html>
